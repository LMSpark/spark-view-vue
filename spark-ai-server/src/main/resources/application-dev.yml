spring:
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3307/spark_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:spark}
    password: ${MYSQL_PASSWORD:spark}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

spark:
  datasource:
    mode: ${SPARK_DATASOURCE_MODE:direct}
  pages:
    storage:
      type: file
  rate-limit:
    enabled: false
