spring:
  datasource:
    url: jdbc:h2:file:./data/sparkdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

spark:
  pages:
    storage:
      type: file
  rate-limit:
    enabled: false
