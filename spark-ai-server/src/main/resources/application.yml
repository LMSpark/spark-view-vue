server:
  port: 8180

spring:
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3406/spark_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:spark}
    password: ${MYSQL_PASSWORD:spark}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false

spark:
  datasource:
    # direct: application-managed Hikari pools; jta-jndi: container-managed XA DataSources by JNDI.
    mode: ${SPARK_DATASOURCE_MODE:direct}

  pages:
    # 页面配置目录（仅用于 DataInitializer 首次迁移）
    config-dir: ${PAGES_CONFIG_DIR:./data/pages-config}
    storage:
      type: ${PAGES_STORAGE_TYPE:file}
      git-remote: ${PAGES_STORAGE_GIT_REMOTE:}
      s3-endpoint: ${PAGES_STORAGE_S3_ENDPOINT:}
      s3-bucket: ${PAGES_STORAGE_S3_BUCKET:}
      s3-region: ${PAGES_STORAGE_S3_REGION:us-east-1}
      s3-access-key: ${PAGES_STORAGE_S3_ACCESS_KEY:}
      s3-secret-key: ${PAGES_STORAGE_S3_SECRET_KEY:}

  rate-limit:
    enabled: ${SPARK_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${SPARK_RATE_LIMIT_RPM:600}
    burst: ${SPARK_RATE_LIMIT_BURST:120}
    trusted-proxy: ${SPARK_TRUSTED_PROXY:false}

  ai:
    session:
      retention-days: ${AI_SESSION_RETENTION_DAYS:30}
      cleanup-cron: ${AI_SESSION_CLEANUP_CRON:0 17 3 * * *}
    openai:
      # ── LLM 服务地址 ────────────────────────────────────────────────────────
      # OpenAI 官方:    https://api.openai.com
      # Azure OpenAI:   https://{resource}.openai.azure.com
      # 本地 Ollama:    http://localhost:11434
      # 阿里通义:       https://dashscope.aliyuncs.com/compatible-mode
      # DeepSeek:       https://api.deepseek.com
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

      # ── API Key（通过环境变量注入，不要硬编码到配置文件）────────────────────
      # 设置方法：
      #   Windows PowerShell: $env:OPENAI_API_KEY = "sk-..."
      #   Linux/macOS:        export OPENAI_API_KEY="sk-..."
      #   .env.java 文件:     见 README.md
      api-key: ${OPENAI_API_KEY:your-api-key-here}

      # ── 模型名称 ────────────────────────────────────────────────────────────
      # OpenAI:   gpt-4o / gpt-4o-mini / gpt-3.5-turbo
      # Ollama:   llama3.1 / qwen2.5:7b / deepseek-r1:7b
      # DeepSeek: deepseek-chat / deepseek-reasoner
      #   - deepseek-chat:     通用对话，支持 json-mode/temperature/top_p
      #   - deepseek-reasoner: 推理模型，自动禁用 temperature/top_p/json-mode，
      #                        流式输出含 reasoning_content（思考过程）
      # 通义:     qwen-turbo / qwen-plus / qwen-max
      model: ${AI_MODEL:gpt-4o}

      # 生成温度（0 = 确定性, 1 = 最大随机）— 配置生成建议 0.2~0.4
      # ⚠️ DeepSeek-reasoner 不支持此参数（自动忽略）
      temperature: 0.3

      # 最大输出 token 数
      # DeepSeek-chat 上限 8192，DeepSeek-reasoner 上限 16384
      max-tokens: 8192

      # 是否启用 JSON 模式（response_format: json_object）
      # OpenAI gpt-4o / gpt-3.5-turbo-1106+ / DeepSeek-chat 支持
      # DeepSeek-reasoner 不支持（自动禁用）
      # Ollama 本地模型通常不支持，需改为 false
      json-mode: ${AI_JSON_MODE:true}

      # ── 可选采样参数 ──────────────────────────────────────────────────────
      # frequency-penalty: 0.0    # -2.0 ~ 2.0，DeepSeek 在线搜索建议 ≥0.6
      # presence-penalty: 0.0     # -2.0 ~ 2.0
      # top-p: 1.0                # 0 ~ 1，⚠️ DeepSeek-reasoner 不支持

      # ────────────────────────────────────────────────────────────────────────
      # DeepSeek 快速配置示例（取消注释即可使用）：
      #
      # deepseek-chat（通用对话）：
      #   base-url: https://api.deepseek.com
      #   model: deepseek-chat
      #   temperature: 0.3
      #   max-tokens: 8192
      #   json-mode: true
      #
      # deepseek-reasoner（深度推理）：
      #   base-url: https://api.deepseek.com
      #   model: deepseek-reasoner
      #   max-tokens: 16384
      #   json-mode: false          # reasoner 不支持，也会自动禁用
      #   # temperature / top-p / frequency-penalty / presence-penalty 自动忽略
      # ────────────────────────────────────────────────────────────────────────

logging:
  level:
    com.spark.ai: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
