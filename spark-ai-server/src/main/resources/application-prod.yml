spring:
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/spark_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:spark}
    password: ${MYSQL_PASSWORD:spark}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

spark:
  pages:
    config-dir: ${PAGES_CONFIG_DIR:/data/pages-config}
    storage:
      type: ${PAGES_STORAGE_TYPE:file}
  rate-limit:
    enabled: ${SPARK_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${SPARK_RATE_LIMIT_RPM:600}
    burst: ${SPARK_RATE_LIMIT_BURST:120}
    trusted-proxy: ${SPARK_TRUSTED_PROXY:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
