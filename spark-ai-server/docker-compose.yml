services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spark_ai
      MYSQL_USER: spark
      MYSQL_PASSWORD: spark
      MYSQL_ROOT_PASSWORD: root
    command: ["mysqld", "--port=3406"]
    ports:
      # MySQL standard port + 100.
      - "3406:3406"
    volumes:
      - spark-ai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3406", "-pspark"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # MySQL standard port + 100 inside and outside Compose.
      MYSQL_JDBC_URL: jdbc:mysql://mysql:3406/spark_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: spark
      MYSQL_PASSWORD: spark
      PAGES_CONFIG_DIR: /data/pages-config
      PAGES_STORAGE_TYPE: file
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key-here}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
    ports:
      - "8180:8180"
    volumes:
      - spark-ai-pages:/data/pages-config

volumes:
  spark-ai-mysql:
  spark-ai-pages:
