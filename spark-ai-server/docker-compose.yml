services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spark_ai
      MYSQL_USER: spark
      MYSQL_PASSWORD: spark
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Host uses 3307 to avoid colliding with any local MySQL on 3306.
      # Containers still reach this service on mysql:3306 inside the Compose network.
      - "3307:3306"
    volumes:
      - spark-ai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pspark"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Compose-internal connection; host tools use 127.0.0.1:3307.
      MYSQL_JDBC_URL: jdbc:mysql://mysql:3306/spark_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: spark
      MYSQL_PASSWORD: spark
      PAGES_CONFIG_DIR: /data/pages-config
      PAGES_STORAGE_TYPE: file
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key-here}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
    ports:
      - "8080:8080"
    volumes:
      - spark-ai-pages:/data/pages-config

volumes:
  spark-ai-mysql:
  spark-ai-pages:
