<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vue Virtual Card Page Loader Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef4f8;
      --ink: #172033;
      --muted: #66758a;
      --line: #d8e0ea;
      --line-strong: #b8c4d2;
      --accent: #0f766e;
      --accent-strong: #0a5f59;
      --violet: #6656d9;
      --amber: #b7791f;
      --red: #b42318;
      --radius: 8px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [v-cloak] {
      display: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #f2fbfa;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled,
    button:disabled:hover {
      border-color: var(--line);
      color: var(--muted);
      background: #f6f8fb;
      cursor: not-allowed;
      transform: none;
    }

    button.primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    button.primary:hover {
      border-color: var(--accent-strong);
      background: var(--accent-strong);
    }

    .control-bar,
    .live-strip {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .control-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 140px 140px auto;
      gap: 12px;
      align-items: end;
      padding: 12px;
      margin-bottom: 12px;
    }

    .control {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    input[type="number"] {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .live-strip {
      display: grid;
      grid-template-columns: 1fr repeat(4, auto);
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .live-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: baseline;
      min-width: 0;
    }

    .live-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .live-title strong {
      color: var(--accent-strong);
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      height: 28px;
      border-radius: 999px;
      padding: 0 10px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill.active {
      color: #fff;
      background: var(--violet);
    }

    .status-pill.optimized {
      color: var(--accent-strong);
      background: #e9f7f5;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 14px;
      align-items: start;
    }

    .viewer,
    .side {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .viewer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .viewer-head strong {
      font-size: 14px;
    }

    .viewer-head span {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .viewport {
      position: relative;
      height: min(68vh, 660px);
      min-height: 460px;
      overflow: auto;
      background: #fff;
      scrollbar-gutter: stable;
    }

    .viewport-wrap {
      position: relative;
    }

    .scroll-hud {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: max-content;
      max-width: calc(100% - 28px);
      border: 1px solid rgba(102, 86, 217, 0.18);
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.12);
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }

    .scroll-hud strong {
      color: var(--violet);
      font-variant-numeric: tabular-nums;
    }

    .scroll-hud.active {
      color: #fff;
      border-color: var(--violet);
      background: var(--violet);
    }

    .scroll-hud.active strong {
      color: #fff;
    }

    .spacer {
      width: 1px;
      opacity: 0;
    }

    .page-block {
      position: absolute;
      top: 0;
      left: 0;
      right: 14px;
      padding: 16px;
      will-change: transform;
    }

    .page-inner {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      height: 100%;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .page-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .page-start {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .page-start span {
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
    }

    .page-start strong {
      color: var(--ink);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
    }

    .data-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 7px;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 10px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(23, 32, 51, 0.06);
    }

    .data-card:nth-child(3n + 2) {
      border-left-color: var(--violet);
    }

    .data-card:nth-child(3n) {
      border-left-color: var(--amber);
    }

    .card-top,
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .card-index {
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .card-tag {
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--violet);
      background: #f0eefe;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .card-body {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
      min-width: 0;
      min-height: 0;
    }

    .card-copy {
      min-width: 0;
      min-height: 0;
    }

    .card-image {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 64px;
      overflow: hidden;
      border-radius: 6px;
      background: #e8eef6;
      isolation: isolate;
    }

    .card-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 160ms ease, opacity 160ms ease;
    }

    .card-image.status-loading img,
    .card-image.status-downgraded img {
      filter: saturate(0.7) blur(1px);
      opacity: 0.78;
    }

    .card-image-placeholder {
      display: grid;
      place-items: center;
      min-height: 100%;
      color: var(--muted);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.16), rgba(102, 86, 217, 0.12)),
        #edf3f8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .card-image-status {
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 5px;
      z-index: 1;
      overflow: hidden;
      border-radius: 999px;
      padding: 3px 6px;
      color: #fff;
      background: rgba(23, 32, 51, 0.68);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skeleton-image {
      border: 0;
    }

    .card-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-note {
      display: -webkit-box;
      min-width: 0;
      overflow: hidden;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .card-bottom {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .card-bottom strong {
      color: var(--ink);
    }

    .skeleton-line {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #edf1f6 0%, #dfe7f1 45%, #edf1f6 100%);
      background-size: 220% 100%;
      animation: shimmer 1.2s linear infinite;
    }

    .skeleton-line.short {
      width: 42%;
    }

    .skeleton-line.medium {
      width: 70%;
    }

    @keyframes shimmer {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: -100% 0;
      }
    }

    .side {
      padding: 14px;
    }

    .metric-grid {
      display: grid;
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fff;
    }

    .metric-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .metric-value {
      display: block;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      background: #e9f7f5;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .chip.pending {
      background: #fff4dc;
      color: var(--amber);
    }

    .notice {
      min-height: 18px;
      margin-top: 10px;
      color: var(--red);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 900px) {
      .topbar,
      .main {
        display: grid;
        grid-template-columns: 1fr;
      }

      .control-bar,
      .live-strip {
        grid-template-columns: 1fr;
      }

      .button-row {
        width: 100%;
      }
    }

    @media (max-width: 700px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding-top: 16px;
      }

      .card-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, minmax(0, 1fr));
      }

      .card-body {
        grid-template-columns: 92px minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="./vendor/vue.global.prod.js"></script>
  <script>
    (() => {
      const { createApp, nextTick, markRaw } = Vue;
      const nf = new Intl.NumberFormat("zh-CN");
      const tags = ["审核", "草稿", "已同步", "待确认", "归档", "变更"];
      const imagePalette = [
        ["#0f766e", "#7dd3fc"],
        ["#6656d9", "#f0abfc"],
        ["#b7791f", "#fde68a"],
        ["#2563eb", "#86efac"],
        ["#be123c", "#fdba74"],
        ["#475569", "#c4b5fd"]
      ];

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function toPositiveInteger(value, fallback = 1) {
        const next = Number.parseInt(value, 10);
        return Number.isFinite(next) ? next : fallback;
      }

      function formatNumber(value) {
        return nf.format(value);
      }

      function makeAbortError() {
        try {
          return new DOMException("Mock request aborted", "AbortError");
        } catch {
          const error = new Error("Mock request aborted");
          error.name = "AbortError";
          return error;
        }
      }

      function escapeSvgText(value) {
        return String(value).replace(/[&<>"']/g, (char) => {
          switch (char) {
            case "&":
              return "&amp;";
            case "<":
              return "&lt;";
            case ">":
              return "&gt;";
            case '"':
              return "&quot;";
            default:
              return "&#39;";
          }
        });
      }

      function svgToDataUri(svg) {
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function colorsFor(cardId) {
        return imagePalette[cardId % imagePalette.length];
      }

      function buildCardImage(card, mode) {
        const [start, end] = colorsFor(card.id);
        const label = escapeSvgText(`#${card.id}`);
        const title = escapeSvgText(card.title);
        const tag = escapeSvgText(card.tag);
        const opacity = mode === "preview" ? 0.58 : 1;
        const textureOpacity = mode === "preview" ? 0.14 : 0.24;

        return svgToDataUri(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="${title}">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="${start}"/>
                <stop offset="100%" stop-color="${end}"/>
              </linearGradient>
              <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
                <circle cx="3" cy="3" r="2" fill="#ffffff" opacity="${textureOpacity}"/>
              </pattern>
            </defs>
            <rect width="320" height="180" rx="18" fill="url(#g)" opacity="${opacity}"/>
            <rect width="320" height="180" rx="18" fill="url(#dots)"/>
            <circle cx="258" cy="34" r="58" fill="#ffffff" opacity="0.16"/>
            <circle cx="32" cy="160" r="72" fill="#172033" opacity="0.14"/>
            <text x="24" y="46" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">${label}</text>
            <text x="24" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">${tag}</text>
            <text x="24" y="132" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">${title}</text>
          </svg>
        `);
      }

      function buildMockCardImagePreview(card) {
        return buildCardImage(card, "preview");
      }

      function newIdleImageState() {
        return {
          status: "idle",
          src: "",
          previewSrc: "",
          errorText: "",
          delay: null
        };
      }

      function buildMockCards(page, pageSize) {
        return Array.from({ length: pageSize }, (_, index) => {
          const id = (page - 1) * pageSize + index + 1;
          return {
            id,
            title: `第 ${formatNumber(page)} 页卡片 ${index + 1}`,
            note: `mockFetchCards 异步返回的数据；真实项目里这里会接 DataSet / DataView 的 page=${page} 查询结果。`,
            tag: tags[(id + page) % tags.length],
            score: `${((id * 17) % 91) + 9}%`
          };
        });
      }

      function mockFetchCards({ page, pageSize, signal }) {
        const delay = 260 + Math.floor(Math.random() * 260);
        return new Promise((resolve, reject) => {
          if (signal?.aborted) {
            reject(makeAbortError());
            return;
          }

          const timer = window.setTimeout(() => {
            if (signal?.aborted) {
              reject(makeAbortError());
              return;
            }
            resolve({
              page,
              pageSize,
              delay,
              cards: buildMockCards(page, pageSize)
            });
          }, delay);

          signal?.addEventListener(
            "abort",
            () => {
              window.clearTimeout(timer);
              reject(makeAbortError());
            },
            { once: true }
          );
        });
      }

      function mockFetchCardImage({ card, signal }) {
        const delay = 180 + Math.floor(Math.random() * 360);
        return new Promise((resolve, reject) => {
          if (signal?.aborted) {
            reject(makeAbortError());
            return;
          }

          const timer = window.setTimeout(() => {
            if (signal?.aborted) {
              reject(makeAbortError());
              return;
            }

            resolve({
              cardId: card.id,
              delay,
              src: buildCardImage(card, "full"),
              previewSrc: buildCardImage(card, "preview")
            });
          }, delay);

          signal?.addEventListener(
            "abort",
            () => {
              window.clearTimeout(timer);
              reject(makeAbortError());
            },
            { once: true }
          );
        });
      }

      const PageHeader = {
        props: {
          totalPages: { type: Number, required: true }
        },
        emits: ["jump"],
        template: `
          <header class="topbar">
            <div>
              <h1>Vue 卡片虚拟分页</h1>
              <p class="subtitle">全 Vue 组件版；每页 6 个卡片，mockFetchCards 模拟异步分页数据，图片按可见区域请求。</p>
            </div>
            <div class="button-row" aria-label="快捷跳页">
              <button type="button" @click="$emit('jump', 1)">第 1 页</button>
              <button type="button" @click="$emit('jump', 800)">第 800 页</button>
              <button type="button" class="primary" @click="$emit('jump', totalPages)">最后一页</button>
            </div>
          </header>
        `
      };

      const PageControls = {
        props: {
          totalPages: { type: Number, required: true },
          currentPage: { type: Number, required: true },
          rangePage: { type: Number, required: true },
          draftTotalPages: { type: Number, required: true },
          jumpPage: { type: Number, required: true }
        },
        emits: [
          "range-input",
          "range-drag-start",
          "range-release",
          "draft-total-input",
          "jump-input",
          "apply-total",
          "jump",
          "clear-cache",
          "nudge"
        ],
        methods: {
          readInt(event, fallback) {
            return toPositiveInteger(event.target.value, fallback);
          }
        },
        template: `
          <section class="control-bar" aria-label="定位控制">
            <div class="control">
              <label for="pageRange">拖拽定位页码</label>
              <input
                id="pageRange"
                type="range"
                min="1"
                :max="totalPages"
                step="1"
                :value="rangePage"
                @input="$emit('range-input', readInt($event, rangePage))"
                @pointerdown="$emit('range-drag-start')"
                @pointerup="$emit('range-release')"
              />
            </div>
            <div class="control">
              <label for="totalPagesInput">总页数</label>
              <input
                id="totalPagesInput"
                type="number"
                min="1"
                step="1"
                :value="draftTotalPages"
                @input="$emit('draft-total-input', readInt($event, draftTotalPages))"
              />
            </div>
            <div class="control">
              <label for="jumpInput">跳转页</label>
              <input
                id="jumpInput"
                type="number"
                min="1"
                :max="totalPages"
                step="1"
                :value="jumpPage"
                @input="$emit('jump-input', readInt($event, jumpPage))"
              />
            </div>
            <div class="button-row">
              <button type="button" class="primary" @click="$emit('apply-total')">应用</button>
              <button type="button" @click="$emit('nudge', -1)" :disabled="currentPage <= 1">上页</button>
              <button type="button" @click="$emit('nudge', 1)" :disabled="currentPage >= totalPages">下页</button>
              <button type="button" @click="$emit('jump', jumpPage)">跳转</button>
              <button type="button" @click="$emit('clear-cache')">清缓存</button>
            </div>
          </section>
        `
      };

      const LiveStatus = {
        props: {
          isDragging: { type: Boolean, required: true },
          currentPage: { type: Number, required: true },
          totalPages: { type: Number, required: true },
          pageSize: { type: Number, required: true },
          loadPolicyText: { type: String, required: true },
          wheelStatusText: { type: String, required: true }
        },
        methods: {
          format: formatNumber
        },
        template: `
          <section class="live-strip" aria-live="polite">
            <div class="live-title">
              <span>{{ isDragging ? "正在定位到" : "当前显示" }}</span>
              <strong>第 {{ format(currentPage) }} 页开头</strong>
              <span>/ 共 {{ format(totalPages) }} 页</span>
            </div>
            <span class="status-pill" :class="{ active: isDragging }">{{ isDragging ? "拖动中" : "已停稳" }}</span>
            <span class="status-pill optimized">{{ loadPolicyText }}</span>
            <span class="status-pill">{{ wheelStatusText }}</span>
            <span class="status-pill">每页 {{ pageSize }} 个卡片</span>
          </section>
        `
      };

      const LazyCardImage = {
        props: {
          card: { type: Object, required: true },
          rootMargin: { type: String, default: "96px 0px" }
        },
        data() {
          return {
            imageState: newIdleImageState(),
            observer: null,
            activeController: null,
            requestToken: 0,
            isVisible: false
          };
        },
        computed: {
          statusText() {
            switch (this.imageState.status) {
              case "loading":
                return "图片请求中";
              case "loaded":
                return this.imageState.delay ? `已加载 ${this.imageState.delay}ms` : "已加载";
              case "downgraded":
                return "离开后降级";
              case "error":
                return this.imageState.errorText || "图片失败";
              default:
                return "等待进入视口";
            }
          },
          placeholderText() {
            return this.imageState.status === "loading" ? "requesting" : "queued";
          }
        },
        watch: {
          "card.id"() {
            this.abortCurrentRequest();
            this.resetImageState();
            if (this.isVisible) {
              this.requestImage();
            }
          }
        },
        mounted() {
          nextTick(() => {
            this.mountObserver();
          });
        },
        beforeUnmount() {
          this.observer?.disconnect();
          this.observer = null;
          this.abortCurrentRequest();
        },
        methods: {
          resetImageState() {
            this.imageState = newIdleImageState();
          },
          abortCurrentRequest() {
            this.requestToken += 1;
            this.activeController?.abort();
            this.activeController = null;
          },
          requestImage() {
            if (this.imageState.status === "loading" || this.imageState.status === "loaded") return;

            const controller = markRaw(new AbortController());
            const token = ++this.requestToken;
            const previewSrc = this.imageState.previewSrc || buildMockCardImagePreview(this.card);
            this.activeController = controller;
            this.imageState = {
              status: "loading",
              src: previewSrc,
              previewSrc,
              errorText: "",
              delay: null
            };

            mockFetchCardImage({
              card: this.card,
              signal: controller.signal
            })
              .then((result) => {
                if (token !== this.requestToken || controller.signal.aborted) return;

                this.imageState = {
                  status: "loaded",
                  src: result.src,
                  previewSrc: result.previewSrc,
                  errorText: "",
                  delay: result.delay
                };
              })
              .catch((error) => {
                if (token !== this.requestToken || controller.signal.aborted) return;

                this.imageState = {
                  ...this.imageState,
                  status: "error",
                  errorText: error?.message || String(error)
                };
              })
              .finally(() => {
                if (this.activeController === controller) {
                  this.activeController = null;
                }
              });
          },
          downgradeImage() {
            this.abortCurrentRequest();

            const previewSrc = this.imageState.previewSrc;
            if (!previewSrc) {
              this.resetImageState();
              return;
            }

            this.imageState = {
              ...this.imageState,
              status: "downgraded",
              src: previewSrc,
              errorText: ""
            };
          },
          handleIntersection(entries) {
            const nextVisible = entries.some((entry) => entry.isIntersecting || entry.intersectionRatio > 0);
            if (nextVisible === this.isVisible) return;

            this.isVisible = nextVisible;
            if (this.isVisible) {
              this.requestImage();
              return;
            }

            this.downgradeImage();
          },
          mountObserver() {
            const element = this.$refs.host;
            if (!element) return;

            this.observer?.disconnect();
            if (!("IntersectionObserver" in window)) {
              this.isVisible = true;
              this.requestImage();
              return;
            }

            const root = element.closest(".viewport");
            this.observer = markRaw(
              new IntersectionObserver((entries) => this.handleIntersection(entries), {
                root: root instanceof Element ? root : null,
                rootMargin: this.rootMargin,
                threshold: 0.01
              })
            );
            this.observer.observe(element);
          }
        },
        template: `
          <div ref="host" class="card-image" :class="'status-' + imageState.status">
            <img
              v-if="imageState.src"
              :src="imageState.src"
              :alt="card.title + ' 缩略图'"
              decoding="async"
              loading="eager"
            />
            <div v-else class="card-image-placeholder">
              <span>{{ placeholderText }}</span>
            </div>
            <span class="card-image-status">{{ statusText }}</span>
          </div>
        `
      };

      const VirtualCardViewport = {
        components: {
          LazyCardImage
        },
        props: {
          cache: { type: Object, required: true },
          pending: { type: Object, required: true },
          currentPage: { type: Number, required: true },
          firstCardNumber: { type: Number, required: true },
          lastCardNumber: { type: Number, required: true },
          pageHeight: { type: Number, required: true },
          pageSize: { type: Number, required: true },
          progressText: { type: String, required: true },
          scrollSpacerHeight: { type: Number, required: true },
          visiblePages: { type: Array, required: true },
          isDragging: { type: Boolean, required: true }
        },
        emits: ["scroll-top", "viewport-ready", "wheel-page"],
        mounted() {
          this.$emit("viewport-ready", this.viewportHeight());
        },
        methods: {
          format: formatNumber,
          viewportHeight() {
            return this.$refs.viewport?.clientHeight || 0;
          },
          setScrollTop(value) {
            if (this.$refs.viewport) {
              this.$refs.viewport.scrollTop = value;
            }
          },
          onScroll() {
            this.$emit("scroll-top", this.$refs.viewport.scrollTop);
          },
          onWheel(event) {
            if (event.ctrlKey || event.deltaY === 0) return;
            event.preventDefault();
            const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? this.pageHeight : 1;
            this.$emit("wheel-page", {
              deltaY: event.deltaY * unit,
              timeStamp: event.timeStamp
            });
          },
          cardNumber(page, slot) {
            return (page - 1) * this.pageSize + slot;
          },
          cardFor(page, slot) {
            const cards = this.cache[page];
            return cards ? cards[slot - 1] : null;
          },
          isPagePending(page) {
            return Boolean(this.pending[page]);
          },
          pageStatus(page) {
            if (this.cache[page]) return "已加载 6 个卡片";
            if (this.pending[page]) return "mock 异步加载中";
            if (this.isDragging) return "拖动中暂不请求";
            return "等待停稳后请求";
          }
        },
        template: `
          <div class="viewer">
            <div class="viewer-head">
              <strong>卡片列表</strong>
              <span>滚动比例 {{ progressText }}，卡片 {{ format(firstCardNumber) }}-{{ format(lastCardNumber) }}</span>
            </div>

            <div class="viewport-wrap">
              <div class="scroll-hud" :class="{ active: isDragging }">
                {{ isDragging ? "拖动中" : "当前页" }}:
                <strong>第 {{ format(currentPage) }} 页开头</strong>
              </div>

              <div ref="viewport" class="viewport" tabindex="0" aria-label="Vue 虚拟分页卡片" @scroll="onScroll" @wheel="onWheel">
                <div class="spacer" :style="{ height: scrollSpacerHeight + 'px' }"></div>

                <section
                  v-for="page in visiblePages"
                  :key="page"
                  class="page-block"
                  :style="{ height: pageHeight + 'px', transform: 'translateY(' + ((page - 1) * pageHeight) + 'px)' }"
                >
                  <div class="page-inner">
                    <div class="page-meta">
                      <div class="page-start">
                        <span>页开头</span>
                        <strong>第 {{ format(page) }} 页开头</strong>
                      </div>
                      <span>{{ pageStatus(page) }}</span>
                    </div>
                    <div class="card-grid">
                      <article v-for="slot in pageSize" :key="page + '-' + slot" class="data-card">
                        <template v-if="cardFor(page, slot)">
                          <div class="card-top">
                            <span class="card-index">#{{ format(cardFor(page, slot).id) }}</span>
                            <span class="card-tag">{{ cardFor(page, slot).tag }}</span>
                          </div>
                          <div class="card-body">
                            <lazy-card-image :card="cardFor(page, slot)" />
                            <div class="card-copy">
                              <h2 class="card-title">{{ cardFor(page, slot).title }}</h2>
                              <p class="card-note">{{ cardFor(page, slot).note }}</p>
                            </div>
                          </div>
                          <div class="card-bottom">
                            <span>页内 {{ slot }}/{{ pageSize }}</span>
                            <strong>{{ cardFor(page, slot).score }}</strong>
                          </div>
                        </template>
                        <template v-else>
                          <div class="card-top">
                            <span class="card-index">#{{ format(cardNumber(page, slot)) }}</span>
                            <span class="card-tag">{{ isPagePending(page) ? "loading" : "queued" }}</span>
                          </div>
                          <div class="card-body">
                            <div class="card-image skeleton-image">
                              <div class="card-image-placeholder">
                                <span>queued</span>
                              </div>
                            </div>
                            <div class="card-copy">
                              <div class="skeleton-line medium"></div>
                              <p class="card-note">第 {{ format(page) }} 页的 mock 数据会在停稳后异步填充。</p>
                            </div>
                          </div>
                          <div class="card-bottom">
                            <span class="skeleton-line short"></span>
                            <span>pending</span>
                          </div>
                        </template>
                      </article>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>
        `
      };

      const CachePanel = {
        props: {
          currentPage: { type: Number, required: true },
          totalCards: { type: Number, required: true },
          cachedPages: { type: Array, required: true },
          pendingPages: { type: Array, required: true },
          notice: { type: String, required: true },
          lastRequestText: { type: String, required: true }
        },
        methods: {
          format: formatNumber
        },
        template: `
          <aside class="side" aria-label="缓存状态">
            <div class="metric-grid">
              <div class="metric">
                <span class="metric-label">当前页</span>
                <span class="metric-value">{{ format(currentPage) }}</span>
              </div>
              <div class="metric">
                <span class="metric-label">总卡片数</span>
                <span class="metric-value">{{ format(totalCards) }}</span>
              </div>
              <div class="metric">
                <span class="metric-label">已缓存页</span>
                <span class="metric-value">{{ format(cachedPages.length) }}</span>
                <div class="chip-list">
                  <span v-for="page in cachedPages.slice(0, 15)" :key="'c-' + page" class="chip">{{ page }}</span>
                  <span v-if="cachedPages.length > 15" class="chip">+{{ cachedPages.length - 15 }}</span>
                </div>
              </div>
              <div class="metric">
                <span class="metric-label">正在请求页</span>
                <span class="metric-value">{{ format(pendingPages.length) }}</span>
                <div class="chip-list">
                  <span v-for="page in pendingPages.slice(0, 15)" :key="'p-' + page" class="chip pending">{{ page }}</span>
                </div>
              </div>
              <div class="metric">
                <span class="metric-label">最近 mock 请求</span>
                <span class="metric-value" style="font-size: 13px;">{{ lastRequestText || "等待请求" }}</span>
              </div>
            </div>
            <div class="notice" role="status">{{ notice }}</div>
          </aside>
        `
      };

      const App = {
        components: {
          PageHeader,
          PageControls,
          LiveStatus,
          VirtualCardViewport,
          CachePanel
        },
        data() {
          return {
            totalPages: 1000,
            draftTotalPages: 1000,
            pageSize: 6,
            pageHeight: 540,
            scrollTop: 0,
            viewportHeight: 0,
            rangePage: 1,
            jumpPage: 800,
            isDragging: false,
            dragTimer: 0,
            loadTimer: 0,
            resizeTimer: 0,
            wheelTimer: 0,
            wheelDelta: 0,
            wheelStartAt: 0,
            wheelLastAt: 0,
            lastWheelJumpPages: 0,
            lastWheelSpeed: 0,
            lastLoadTarget: 1,
            maxCachedPages: 24,
            programmaticScroll: false,
            requestEpoch: 0,
            controllers: markRaw(new Map()),
            cache: {},
            pending: {},
            notice: "",
            lastRequestText: ""
          };
        },
        computed: {
          totalCards() {
            return this.totalPages * this.pageSize;
          },
          virtualHeight() {
            return this.totalPages * this.pageHeight;
          },
          scrollSpacerHeight() {
            return this.virtualHeight + Math.max(0, this.viewportHeight - this.pageHeight);
          },
          currentPage() {
            return this.pageFromScroll(this.scrollTop);
          },
          firstCardNumber() {
            return (this.currentPage - 1) * this.pageSize + 1;
          },
          lastCardNumber() {
            return Math.min(this.firstCardNumber + this.pageSize - 1, this.totalCards);
          },
          progressText() {
            const maxScroll = Math.max(1, this.scrollSpacerHeight - this.viewportHeight);
            const ratio = clamp((this.scrollTop / maxScroll) * 100, 0, 100);
            return `${ratio.toFixed(2)}%`;
          },
          visiblePages() {
            const first = this.pageFromScroll(Math.max(0, this.scrollTop - this.pageHeight));
            const last = this.pageFromScroll(this.scrollTop + this.viewportHeight + this.pageHeight);
            const pages = [];
            for (let page = first; page <= last; page += 1) {
              pages.push(page);
            }
            return pages;
          },
          cachedPages() {
            return Object.keys(this.cache).map(Number).sort((a, b) => a - b);
          },
          pendingPages() {
            return Object.keys(this.pending).map(Number).sort((a, b) => a - b);
          },
          loadPolicyText() {
            return this.isDragging ? "停稳吸附页开头" : `加载第 ${this.format(this.lastLoadTarget)} 页附近`;
          },
          wheelStatusText() {
            if (!this.lastWheelJumpPages) return "滚轮按速度跳页";
            return `滚轮跳 ${this.format(this.lastWheelJumpPages)} 页`;
          }
        },
        mounted() {
          this.updatePageHeight();
          nextTick(() => {
            this.refreshViewportHeight();
            this.loadPageWindow(this.currentPage, 1);
          });
          window.addEventListener("resize", this.handleResize);
        },
        beforeUnmount() {
          window.removeEventListener("resize", this.handleResize);
          window.clearTimeout(this.dragTimer);
          window.clearTimeout(this.loadTimer);
          window.clearTimeout(this.resizeTimer);
          window.clearTimeout(this.wheelTimer);
          this.abortAllRequests();
        },
        methods: {
          format: formatNumber,
          computePageHeight() {
            return window.innerWidth <= 700 ? 850 : 540;
          },
          updatePageHeight() {
            this.pageHeight = this.computePageHeight();
          },
          refreshViewportHeight(height) {
            this.viewportHeight = height || this.$refs.cardViewport?.viewportHeight() || 0;
          },
          pageFromScroll(scrollTop) {
            const lastPageTop = Math.max(0, (this.totalPages - 1) * this.pageHeight);
            if (scrollTop >= lastPageTop - 1) return this.totalPages;
            return clamp(Math.floor(scrollTop / this.pageHeight) + 1, 1, this.totalPages);
          },
          markDragging() {
            this.isDragging = true;
            window.clearTimeout(this.dragTimer);
            window.clearTimeout(this.loadTimer);
          },
          releaseDragging() {
            this.scheduleSettledLoad(120);
          },
          handleViewportScroll(nextScrollTop) {
            this.scrollTop = nextScrollTop;
            this.rangePage = this.currentPage;
            this.jumpPage = this.currentPage;
            if (this.programmaticScroll) {
              this.programmaticScroll = false;
              return;
            }
            this.markDragging();
            this.scheduleSettledLoad(220);
          },
          handleRangeInput(page) {
            this.rangePage = page;
            this.markDragging();
            this.scrollToPage(this.rangePage, true);
          },
          nudgePage(delta) {
            this.scrollToPage(clamp(this.currentPage + delta, 1, this.totalPages), false);
          },
          handleWheelPage(event) {
            const now = performance.now();
            if (!this.wheelStartAt || now - this.wheelLastAt > 140 || Math.sign(this.wheelDelta) !== Math.sign(event.deltaY)) {
              this.wheelDelta = 0;
              this.wheelStartAt = now;
            }

            this.wheelDelta += event.deltaY;
            this.wheelLastAt = now;
            window.clearTimeout(this.wheelTimer);
            this.wheelTimer = window.setTimeout(() => {
              this.flushWheelJump();
            }, 70);
          },
          flushWheelJump() {
            if (!this.wheelDelta) return;

            const direction = this.wheelDelta > 0 ? 1 : -1;
            const duration = Math.max(80, this.wheelLastAt - this.wheelStartAt);
            const distance = Math.abs(this.wheelDelta);
            const speed = distance / duration;
            const distancePages = Math.max(1, Math.ceil(distance / 180));
            const speedMultiplier = speed >= 12 ? 4 : speed >= 6 ? 3 : speed >= 2.5 ? 2 : 1;
            const pageStep = clamp(distancePages * speedMultiplier, 1, 40);
            const targetPage = clamp(this.currentPage + direction * pageStep, 1, this.totalPages);
            const jumpedPages = Math.abs(targetPage - this.currentPage);

            this.wheelDelta = 0;
            this.wheelStartAt = 0;
            this.wheelLastAt = 0;
            this.lastWheelSpeed = speed;
            this.lastWheelJumpPages = jumpedPages;

            if (targetPage !== this.currentPage) {
              this.scrollToPage(targetPage, false);
            }
          },
          handleResize() {
            const page = this.currentPage;
            window.clearTimeout(this.resizeTimer);
            this.resizeTimer = window.setTimeout(() => {
              this.updatePageHeight();
              nextTick(() => {
                this.refreshViewportHeight();
                this.scrollToPage(page, false);
              });
            }, 80);
          },
          scrollToPage(page, keepDragging = false) {
            const targetPage = clamp(toPositiveInteger(page, 1), 1, this.totalPages);
            const targetTop = Math.min((targetPage - 1) * this.pageHeight, this.scrollSpacerHeight - this.viewportHeight);
            const nextScrollTop = Math.max(0, targetTop);
            const currentViewportTop = this.$refs.cardViewport?.$refs.viewport?.scrollTop || 0;
            const willScroll = Math.round(currentViewportTop) !== Math.round(nextScrollTop);
            this.rangePage = targetPage;
            this.jumpPage = targetPage;
            this.scrollTop = nextScrollTop;
            this.programmaticScroll = !keepDragging && willScroll;
            this.$refs.cardViewport?.setScrollTop(nextScrollTop);

            if (keepDragging) {
              this.markDragging();
              this.scheduleSettledLoad(220);
              return;
            }

            this.isDragging = false;
            this.loadPageWindow(targetPage, 1);
          },
          applyTotalPages() {
            const nextTotal = clamp(toPositiveInteger(this.draftTotalPages, 1), 1, 100000);
            this.abortAllRequests();
            this.totalPages = nextTotal;
            this.draftTotalPages = nextTotal;
            this.requestEpoch += 1;
            this.cache = {};
            this.pending = {};
            this.notice = "";
            this.lastRequestText = "";
            nextTick(() => {
              this.scrollToPage(clamp(this.currentPage, 1, this.totalPages), false);
            });
          },
          clearCache() {
            this.abortAllRequests();
            this.requestEpoch += 1;
            this.cache = {};
            this.pending = {};
            this.notice = "";
            this.lastRequestText = "";
            this.loadPageWindow(this.currentPage, 1);
          },
          scheduleSettledLoad(delay) {
            window.clearTimeout(this.dragTimer);
            window.clearTimeout(this.loadTimer);
            this.dragTimer = window.setTimeout(() => {
              this.isDragging = false;
            }, delay);
            this.loadTimer = window.setTimeout(() => {
              const targetPage = this.currentPage;
              this.isDragging = false;
              this.scrollToPage(targetPage, false);
            }, delay + 40);
          },
          loadPageWindow(centerPage, radius = 1) {
            const targetPage = clamp(centerPage, 1, this.totalPages);
            const pages = new Set();
            this.lastLoadTarget = targetPage;

            for (let page = targetPage - radius; page <= targetPage + radius; page += 1) {
              if (page >= 1 && page <= this.totalPages) {
                pages.add(page);
              }
            }

            this.abortRequestsOutside(pages);
            for (const page of pages) {
              this.requestPage(page);
            }
            this.trimCache(targetPage);
          },
          requestPage(page) {
            if (page < 1 || page > this.totalPages) return;
            if (this.cache[page] || this.pending[page]) return;

            const epoch = this.requestEpoch;
            const controller = new AbortController();
            this.controllers.set(page, controller);
            this.pending = { ...this.pending, [page]: true };

            mockFetchCards({
              page,
              pageSize: this.pageSize,
              signal: controller.signal
            })
              .then((result) => {
                if (epoch !== this.requestEpoch || controller.signal.aborted) return;
                this.cache = { ...this.cache, [page]: result.cards };
                this.lastRequestText = `page=${page}, ${result.delay}ms`;
                this.trimCache(this.currentPage);
              })
              .catch((error) => {
                if (error?.name === "AbortError") return;
                this.notice = `mockFetchCards(page=${page}) 失败: ${error.message || error}`;
              })
              .finally(() => {
                if (this.controllers.get(page) === controller) {
                  this.controllers.delete(page);
                }
                if (this.pending[page]) {
                  const nextPending = { ...this.pending };
                  delete nextPending[page];
                  this.pending = nextPending;
                }
              });
          },
          abortRequestsOutside(keepPages) {
            let changed = false;
            const nextPending = { ...this.pending };

            for (const [page, controller] of this.controllers.entries()) {
              if (!keepPages.has(page)) {
                controller.abort();
                this.controllers.delete(page);
                delete nextPending[page];
                changed = true;
              }
            }

            if (changed) {
              this.pending = nextPending;
            }
          },
          abortAllRequests() {
            for (const controller of this.controllers.values()) {
              controller.abort();
            }
            this.controllers.clear();
            this.pending = {};
          },
          trimCache(anchorPage) {
            const pages = Object.keys(this.cache).map(Number);
            if (pages.length <= this.maxCachedPages) return;

            const keep = pages
              .sort((a, b) => Math.abs(a - anchorPage) - Math.abs(b - anchorPage))
              .slice(0, this.maxCachedPages);
            const keepSet = new Set(keep);
            const nextCache = {};
            for (const page of pages) {
              if (keepSet.has(page)) {
                nextCache[page] = this.cache[page];
              }
            }
            this.cache = nextCache;
          }
        },
        template: `
          <main class="app" v-cloak>
            <page-header :total-pages="totalPages" @jump="scrollToPage" />

            <page-controls
              :total-pages="totalPages"
              :current-page="currentPage"
              :range-page="rangePage"
              :draft-total-pages="draftTotalPages"
              :jump-page="jumpPage"
              @range-input="handleRangeInput"
              @range-drag-start="markDragging"
              @range-release="releaseDragging"
              @draft-total-input="draftTotalPages = $event"
              @jump-input="jumpPage = $event"
              @apply-total="applyTotalPages"
              @jump="scrollToPage"
              @clear-cache="clearCache"
              @nudge="nudgePage"
            />

            <live-status
              :is-dragging="isDragging"
              :current-page="currentPage"
              :total-pages="totalPages"
              :page-size="pageSize"
              :load-policy-text="loadPolicyText"
              :wheel-status-text="wheelStatusText"
            />

            <section class="main">
              <virtual-card-viewport
                ref="cardViewport"
                :cache="cache"
                :pending="pending"
                :current-page="currentPage"
                :first-card-number="firstCardNumber"
                :last-card-number="lastCardNumber"
                :page-height="pageHeight"
                :page-size="pageSize"
                :progress-text="progressText"
                :scroll-spacer-height="scrollSpacerHeight"
                :visible-pages="visiblePages"
                :is-dragging="isDragging"
                @scroll-top="handleViewportScroll"
                @viewport-ready="refreshViewportHeight"
                @wheel-page="handleWheelPage"
              />

              <cache-panel
                :current-page="currentPage"
                :total-cards="totalCards"
                :cached-pages="cachedPages"
                :pending-pages="pendingPages"
                :notice="notice"
                :last-request-text="lastRequestText"
              />
            </section>
          </main>
        `
      };

      createApp(App).mount("#app");
    })();
  </script>
</body>
</html>
