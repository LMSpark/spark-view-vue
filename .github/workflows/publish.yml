name: Publish Packages to Private Registry

on:
  push:
    tags:
      - "v*.*.*" # 打 tag 时触发：git tag v0.2.1 && git push --tags
  workflow_dispatch: # 支持手动触发
    inputs:
      dry_run:
        description: "Dry run (build only, no publish)"
        type: boolean
        default: false
      tag:
        description: "npm dist-tag (latest / next / beta)"
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test -- --run

      - name: Publish packages
        env:
          NPM_TOKEN: ${{ secrets.VERDACCIO_AUTH_TOKEN }}
          REGISTRY_URL: ${{ secrets.VERDACCIO_REGISTRY_URL }}
        run: |
          # 写入鉴权配置（runner 临时目录）
          echo "@spark-appworks:registry=${REGISTRY_URL}" >> ~/.npmrc
          echo "//${REGISTRY_URL#http://}/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          TAG="${{ inputs.tag || 'latest' }}"

          node scripts/publish-packages.mjs \
            --registry "${REGISTRY_URL}" \
            --tag "${TAG}" \
            ${DRY_RUN_FLAG}
