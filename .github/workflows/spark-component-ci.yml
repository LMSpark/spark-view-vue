name: CI - spark-component

on:
  push:
    paths:
      - "packages/spark-component/**"
  pull_request:
    paths:
      - "packages/spark-component/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck package
        run: pnpm -C packages/spark-component run typecheck
      - name: Run package tests
        run: pnpm -C packages/spark-component run test:run
        env:
          CI: true
