packages:
  - 'packages/*'

# pnpm 11 默认拦截依赖的 postinstall 脚本，需显式放行。
# esbuild: 下载/选择平台原生二进制，vite/vitest 运行必需。
# vue-demi: 切换 Vue 2/3 模式，Vue 3 下必须执行以正确设置运行时。
allowBuilds:
  esbuild: true
  vue-demi: true

# 工作区基础依赖版本真源。子包用 "catalog:" 引用，禁止重复写死版本。
catalog:
  # ── 应用壳运行时（根 package.json dependencies 安装） ──
  vue: 3.5.38
  vue-router: ^5.1.0
  element-plus: ^2.14.2
  '@element-plus/icons-vue': ^2.3.2
  '@vue-flow/background': ^1.3.2
  '@vue-flow/controls': ^1.1.3
  '@vue-flow/core': ^1.48.2
  '@vue-flow/minimap': ^1.5.4
  vxe-table: ^4.19.17

  # ── 框架无关包运行时（按包归属，单点声明） ──
  axios: ^1.18.0
  ajv: ^8.20.0
  jmespath: 0.16.0
  comlink: ^4.4.2
  '@ag-ui/core': ^0.0.57
  codemirror: ^6.0.2
  '@codemirror/commands': ^6.10.3
  '@codemirror/lang-css': ^6.3.1
  '@codemirror/lang-javascript': ^6.2.5
  '@codemirror/language': ^6.12.3
  '@codemirror/state': ^6.6.0
  '@codemirror/view': ^6.43.1
  vanilla-jsoneditor: ^3.12.0

  # ── 构建 / 测试 / Lint 工具链 ──
  typescript: ~6.0.3
  vite: ^8.0.16
  vitest: ^4.1.9
  eslint: ^10.5.0
  '@eslint/js': ^10.0.1
  '@typescript-eslint/eslint-plugin': ^8.61.1
  '@typescript-eslint/parser': ^8.61.1
  eslint-plugin-vue: ^10.9.2
  vue-eslint-parser: ^10.4.1
  '@types/node': ^26.0.0
  '@types/jmespath': ^0.15.2
  '@vitejs/plugin-vue': ^6.0.7
  '@vue/language-core': 3.3.5
  '@vue/test-utils': ^2.4.11
  vue-tsc: ^3.3.5
  rimraf: ^6.1.3

# 强制版本锁定：vue 全家桶内部包必须版本一致，避免子依赖拉入不一致版本。
# pnpm 11 起 overrides 必须放在此处，package.json 的 pnpm.overrides 已不被读取。
overrides:
  rollup: ^4.62.2
  vue: 3.5.38
  '@vue/runtime-core': 3.5.38
  '@vue/runtime-dom': 3.5.38
  '@vue/reactivity': 3.5.38
  '@vue/shared': 3.5.38
  '@vue/compiler-core': 3.5.38
  '@vue/compiler-dom': 3.5.38
  '@vue/compiler-sfc': 3.5.38
  '@vue/server-renderer': 3.5.38
