<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Dev Login</title></head>
<body>
<p>开发登录中…</p>
<script>
const params = new URLSearchParams(window.location.search)
const token = params.get('token')
if (token) {
  localStorage.setItem('spark_token', token)
  const tenantId = params.get('tenantId') || 'lmspark'
  localStorage.setItem('spark_user', JSON.stringify({
    userId: '1',
    username: params.get('username') || 'admin',
    displayName: params.get('displayName') || '管理员',
    email: '',
    avatar: '',
    roles: ['admin'],
    tenantId: tenantId,
    defaultProjectId: params.get('projectId') || 'homepage'
  }))
  document.querySelector('p').textContent = '已登录，正在跳转…'
  window.location.replace('/')
} else {
  document.querySelector('p').textContent = '缺少 token 参数'
}
</script>
</body>
</html>
